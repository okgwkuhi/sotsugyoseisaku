default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: 5
  username: root
  password: password
  host: db

development:
  <<: *default
  database: bodoge_app_development

test:
  <<: *default
  database: bodoge_app_test

production:
  <<: *default
  database: bodoge_app_production
  username: bodoge_app
  password: <%= ENV["BODOGE_APP_DATABASE_PASSWORD"] %>
  